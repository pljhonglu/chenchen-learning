name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test Go service
        run: go test -race ./...
      - name: Check browser JavaScript
        run: |
          node --check public/app.js
          node --check public/speech.js
          node --check public/english.js
          node --check public/english-audio.js
          node --check public/writing-vocabulary.js
          node --check public/writing-audio.js
          node --check public/writing-strokes.js
          node scripts/test-progress.cjs
          node scripts/test-math.cjs
          node scripts/test-speech.cjs
          node scripts/test-poem-media.cjs
          node scripts/test-english.cjs
          node scripts/test-english-audio.cjs
          node scripts/test-english-media.cjs
          node scripts/test-writing-audio.cjs
          node scripts/test-writing-strokes.cjs
          node scripts/test-writing-media.cjs

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: chenchen-learning:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container and persistent progress
        run: bash scripts/smoke-container.sh chenchen-learning:test
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/pljhonglu/chenchen-learning
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
