name: Apply number-bonds workbook UI
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply number-bonds patches
        run: python3 scripts/apply_number_bonds.py

      - name: Commit site files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css scripts/apply_number_bonds.py scripts/number_bonds_data_a.py scripts/number_bonds_data_b.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "数学：10以内分解/组成练习册式数分解题卡（红线分叉+方框）"
            git push
          fi
