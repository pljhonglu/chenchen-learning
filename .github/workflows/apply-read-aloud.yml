name: Apply read-aloud feature
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Web Speech read-aloud patches
        run: python3 scripts/apply_read_aloud.py

      - name: Commit site files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speech.js index.html styles.css app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "古诗详情页：Web Speech 朗读（题目/作者/逐句，可暂停停止）"
            git push
          fi
