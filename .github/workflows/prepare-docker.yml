name: Prepare Docker frontend public/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-docker.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'server/**'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js for same-origin SQLite API and fill public/
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, shutil
          root = Path(".")
          app = root / "app.js"
          t = app.read_text(encoding="utf-8")
          t = re.sub(r'const API_BASE = "[^"]*";', 'const API_BASE = "";', t, count=1)
          t = t.replace("chenchen-learning-api.pljhonglu.workers.dev", "")
          t = t.replace("if (!API_BASE) throw new Error(\"API_BASE 未配置\");\n    ", "")
          t = t.replace("if (!API_BASE) return null;\n    ", "")
          t = t.replace("if (!API_BASE) return;\n    ", "")
          t = re.sub(
              r"if \(syncBusy\) return;\n    if \(!API_BASE\) \{\n      setSyncStatus\([^\n]+\n      return;\n    \}\n",
              "if (syncBusy) return;\n",
              t,
              count=1,
          )
          t = re.sub(
              r"if \(API_BASE\) \{\n      setSyncStatus\(\"启动中，正在同步…\", \"busy\"\);\n      syncNow\(\"full\"\)\.catch\(\(\) => \{\}\);\n    \} else \{\n      setSyncStatus\([^\n]+\n    \}",
              "setSyncStatus(\"启动中，正在同步…\", \"busy\");\n    syncNow(\"full\").catch(() => {});",
              t,
              count=1,
          )
          t = t.replace("☁️ 云同步", "💾 进度同步")
          t = t.replace("正在连接云端…", "正在连接服务器…")
          t = t.replace("正在从云端拉取…", "正在从服务器拉取…")
          t = t.replace("正在上传到云端…", "正在保存到服务器…")
          t = t.replace("云端暂无数据，打卡后会自动上传", "服务器暂无数据，打卡后会自动保存")
          t = t.replace("已与云端合并", "已与服务器合并")
          t = t.replace("云端较新，已采用云端", "服务器较新，已采用服务器")
          t = t.replace("已同步到云端", "已保存到服务器")
          t = t.replace(
              "所有设备自动共用同一份公开进度；打卡后会上传，打开页面会拉取（离线仍用本机缓存）。",
              "进度保存在本机服务器的 SQLite；各设备访问同一地址即可共用。离线时仍用浏览器缓存，连上后再同步。",
          )
          t = t.replace('${API_BASE ? "" : " · API 未配置"}', "")
          assert "workers.dev" not in t
          assert "生成新码" not in t
          assert 'const API_BASE = "";' in t
          app.write_text(t, encoding="utf-8")
          public = root / "public"
          public.mkdir(exist_ok=True)
          for name in ["index.html", "styles.css", "app.js", "poems.js", "speech.js"]:
              shutil.copy2(root / name, public / name)
              print("copied", name, (public / name).stat().st_size)
          fonts_src, fonts_dst = root / "fonts", public / "fonts"
          if fonts_src.is_dir():
              fonts_dst.mkdir(exist_ok=True)
              for f in fonts_src.iterdir():
                  if f.is_file():
                      shutil.copy2(f, fonts_dst / f.name)
                      print("font", f.name)
          print("ok", app.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "chenchen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app.js public
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Prepare self-hosted frontend (SQLite API, public/)"
            git push
          fi
