name: Assemble poems.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-poems.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode poems and cleanup
        run: |
          set -euo pipefail
          git config user.name "chenchen-bot"
          git config user.email "bot@users.noreply.github.com"
          n=$(cat .github/payloads/poems.count)
          : > /tmp/poems.b64
          i=0
          while [ "$i" -lt "$n" ]; do
            cat ".github/payloads/poems.part$i" >> /tmp/poems.b64
            i=$((i+1))
          done
          mkdir -p public/data
          base64 -d /tmp/poems.b64 > public/data/poems.json
          python3 -c 'import json;print(len(json.load(open("public/data/poems.json"))))'
          git rm -rf .github/payloads .github/workflows/assemble-poems.yml .github/workflows/add-poems-json.yml || true
          rm -rf .github/payloads .github/workflows/assemble-poems.yml .github/workflows/add-poems-json.yml || true
          git add -f public/data/poems.json .gitignore
          git add -A
          git commit -m "feat: add public/data/poems.json (external poem library)"
          git push
