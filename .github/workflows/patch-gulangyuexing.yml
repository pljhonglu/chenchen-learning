name: Patch 古朗月行 eight lines
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append four lines to 古朗月行
        run: python3 scripts/patch_gulangyuexing.py

      - name: Commit poems.js
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poems.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "古朗月行：追加仙人/桂树/白兔/问言四句（八句+拼音）"
            git push
          fi
