name: Unpack classic site to root
on:
  push:
    paths: ['deploy-src/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack classic multi-file site into repo root
        run: |
          set -euo pipefail
          cat deploy-src/classic.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/classic.tar.gz
          tar tzf /tmp/classic.tar.gz
          tar xzf /tmp/classic.tar.gz
          test -f index.html && test -f styles.css && test -f app.js && test -f poems.js
          grep -q 'src="poems.js"' index.html
          grep -q 'const POEMS' poems.js
          python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path('poems.js').read_text(encoding='utf-8')
          n = len(re.findall(r'"id"\s*:\s*"poem-', t))
          print('poem ids', n)
          assert n >= 30, n
          PY
          # remove obsolete gzip loader assets if present
          rm -rf assets || true

      - name: Commit unpacked site files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js poems.js README.md .nojekyll
          git add -u assets || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack classic multi-file site (relative paths, 35 poems)"
            git push
          fi
