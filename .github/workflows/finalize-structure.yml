name: Finalize Docker-only structure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-structure.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor to Docker-only + poems.json
        run: |
          set -euo pipefail
          git config user.name "chenchen-bot"
          git config user.email "bot@users.noreply.github.com"

          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const src = fs.existsSync("public/poems.js") ? "public/poems.js" : "poems.js";
          const code = fs.readFileSync(src, "utf8");
          const ctx = {};
          vm.runInNewContext(code + "\nthis.POEMS = POEMS;", ctx);
          fs.mkdirSync("public/data", { recursive: true });
          fs.writeFileSync("public/data/poems.json", JSON.stringify(ctx.POEMS) + "\n");
          console.log("poems", ctx.POEMS.length);
          NODE

          python3 <<'PY'
          from pathlib import Path
          app = Path("public/app.js")
          t = app.read_text(encoding="utf-8")
          t = t.replace("scheduleCloudPush", "scheduleProgressPush")
          t = t.replace("cloudFetch", "apiFetch")
          t = t.replace("pushToCloud", "pushProgress")
          t = t.replace(
              "// Cloudflare Worker API（部署后填入；空字符串则仅本地）",
              "// Same-origin /api/* (Docker SQLite). Override only if API is on another host.",
          )
          t = t.replace(
              "// ---------- Cloud sync (D1 via Worker, public shared row) ----------",
              "// ---------- Server sync (SQLite via same-origin /api/progress) ----------",
          )
          t = t.replace(
              "const res = await fetch(API_BASE + path, {",
              'const base = API_BASE === undefined || API_BASE === null ? "" : API_BASE;\n'
              "    const res = await fetch(base + path, {",
          )
          if "function ensurePoems" not in t:
              loader = "\n".join([
                  "",
                  "  // ---------- Poems data (loaded from public/data/poems.json) ----------",
                  "  let POEMS = [];",
                  "  let poemsLoadPromise = null;",
                  "",
                  "  function ensurePoems() {",
                  "    if (!poemsLoadPromise) {",
                  '      poemsLoadPromise = fetch("data/poems.json", { cache: "force-cache" })',
                  "        .then((r) => {",
                  '          if (!r.ok) throw new Error("poems_load_failed");',
                  "          return r.json();",
                  "        })",
                  "        .then((data) => {",
                  "          POEMS = Array.isArray(data) ? data : [];",
                  "          return POEMS;",
                  "        })",
                  "        .catch((e) => {",
                  '          console.warn("poems load failed", e);',
                  "          POEMS = [];",
                  "          throw e;",
                  "        });",
                  "    }",
                  "    return poemsLoadPromise;",
                  "  }",
                  "",
              ])
              anchor = '  const SYNC_META_KEY = "chenchen-sync-meta";\n'
              if anchor not in t:
                  raise SystemExit("SYNC_META_KEY missing")
              t = t.replace(anchor, anchor + "\n" + loader, 1)
          if "async function renderHome" not in t:
              t = t.replace(
                  "  function renderHome() {\n",
                  "  async function renderHome() {\n    try { await ensurePoems(); } catch (_) {}\n",
                  1,
              )
          if "async function renderPoems" not in t:
              old = '  function renderPoems() {\n    const el = document.getElementById("poems-content");\n'
              new = (
                  "  async function renderPoems() {\n"
                  '    const el = document.getElementById("poems-content");\n'
                  "    if (!POEMS.length) {\n"
                  "      el.innerHTML = '<div class=\"card\"><div class=\"empty\">loading poems...</div></div>';\n"
                  "      try { await ensurePoems(); } catch (_) {\n"
                  "        el.innerHTML = '<div class=\"card\"><div class=\"empty\">poems load failed</div></div>';\n"
                  "        return;\n"
                  "      }\n"
                  "    }\n"
              )
              if old not in t:
                  raise SystemExit("renderPoems missing")
              t = t.replace(old, new, 1)
          if "async function renderPoemDetail" not in t:
              old = (
                  "  function renderPoemDetail(id) {\n"
                  "    stopSpeechSafe();\n"
                  "    selectedPoemId = id;\n"
                  "    const poem = POEMS.find((p) => p.id === id);\n"
              )
              new = (
                  "  async function renderPoemDetail(id) {\n"
                  "    stopSpeechSafe();\n"
                  "    selectedPoemId = id;\n"
                  "    try { await ensurePoems(); } catch (_) {}\n"
                  "    const poem = POEMS.find((p) => p.id === id);\n"
              )
              if old not in t:
                  raise SystemExit("renderPoemDetail missing")
              t = t.replace(old, new, 1)
          old_init = (
              '  document.addEventListener("DOMContentLoaded", () => {\n'
              "    bindNav();\n"
              '    showView("home");\n'
              "    renderHome();\n"
              '    setSyncStatus("启动中，正在同步…", "busy");\n'
              '    syncNow("full").catch(() => {});\n'
              "  });"
          )
          new_init = (
              '  document.addEventListener("DOMContentLoaded", () => {\n'
              "    bindNav();\n"
              '    showView("home");\n'
              "    ensurePoems()\n"
              "      .catch(() => {})\n"
              "      .finally(() => {\n"
              "        renderHome();\n"
              "      });\n"
              '    setSyncStatus("启动中，正在同步…", "busy");\n'
              '    syncNow("full").catch(() => {});\n'
              "  });"
          )
          if old_init in t:
              t = t.replace(old_init, new_init, 1)
          app.write_text(t, encoding="utf-8")
          print("patched app.js", app.stat().st_size)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          html = p.read_text(encoding="utf-8")
          html2 = html.replace('  <script src="poems.js"></script>\n', "")
          p.write_text(html2, encoding="utf-8")
          print("index ok", "poems.js" not in html2)
          PY

          for p in app.js index.html poems.js speech.js styles.css public/poems.js .nojekyll; do
            if [ -e "$p" ]; then git rm -rf "$p" 2>/dev/null || rm -rf "$p"; fi
          done
          if [ -d fonts ]; then git rm -rf fonts 2>/dev/null || rm -rf fonts; fi
          if [ -d .github/payloads ]; then git rm -rf .github/payloads 2>/dev/null || rm -rf .github/payloads; fi
          if [ -d .github/scripts ]; then git rm -rf .github/scripts 2>/dev/null || rm -rf .github/scripts; fi
          git rm -f .github/workflows/finalize-structure.yml 2>/dev/null || rm -f .github/workflows/finalize-structure.yml

          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "refactor: Docker-only tree; external poems.json; drop cloud residue"
            git push
          fi
