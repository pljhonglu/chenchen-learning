name: Apply cloud sync frontend bundle
on:
  push:
    branches: [main]
    paths:
      - 'scripts/site_parts/sync.h*'
      - 'scripts/site_parts/sync.h.meta'
      - 'scripts/site_parts/sync_bundle.b64.c*'
      - 'scripts/apply_cloud_sync.py'
      - '.github/workflows/apply-cloud-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sync bundle
        run: python3 scripts/apply_cloud_sync.py
      - name: Commit if changed
        run: |
          git config user.name "chenchen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app.js styles.css README.md cloudflare/src/index.js
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Apply cloud sync frontend (API_BASE + sync panel)"
            git push
          fi
