name: Cleanup cloud deploy residue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-repo.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove residue and commit
        run: |
          set -euo pipefail
          git config user.name "chenchen-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 << 'PY'
          from pathlib import Path
          import subprocess

          def run(cmd):
              print("+", " ".join(cmd))
              subprocess.check_call(cmd)

          removed = []
          for p in [
              "cloudflare",
              "deploy-src",
              "scripts",
              ".nojekyll",
              ".github/workflows/prepare-docker.yml",
              "gen_pinyin.py",
          ]:
              path = Path(p)
              if path.exists():
                  if path.is_dir():
                      run(["git", "rm", "-rf", p])
                  else:
                      run(["git", "rm", "-f", p])
                  removed.append(p)
          print("removed:", removed)

          Path(".gitignore").write_text(
              "\n".join([
                  ".venv/",
                  "__pycache__/",
                  "*.pyc",
                  "*.log",
                  ".DS_Store",
                  "data/",
                  "*.db",
                  "*.db-journal",
                  "node_modules/",
                  "screenshots/",
                  "ref/",
                  "",
              ]),
              encoding="utf-8",
          )
          Path(".dockerignore").write_text(
              "\n".join([
                  ".venv",
                  ".git",
                  ".github",
                  "scripts",
                  "screenshots",
                  "ref",
                  "data",
                  "*.log",
                  "**/node_modules",
                  "",
              ]),
              encoding="utf-8",
          )
          wf = Path(".github/workflows/cleanup-repo.yml")
          if wf.exists():
              run(["git", "rm", "-f", str(wf)])
              removed.append(str(wf))

          run(["git", "add", "-A"])
          diff = subprocess.run(["git", "diff", "--staged", "--quiet"])
          if diff.returncode == 0:
              print("nothing to commit")
          else:
              run(["git", "commit", "-m", "chore: remove cloud deploy residue; keep Docker self-host tree"])
              run(["git", "push"])
          PY
