name: Add poems.json
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-poems-json.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract poems and commit
        run: |
          set -euo pipefail
          git config user.name "chenchen-bot"
          git config user.email "bot@users.noreply.github.com"
          printf '%s\n' '.venv/' '__pycache__/' '*.pyc' '*.log' '.DS_Store' '/data/' '*.db' '*.db-journal' 'node_modules/' > .gitignore
          # Find a commit that still CONTAINS poems.js (not the deletion commit)
          SHA=""
          for s in $(git log --all --pretty=format:%H -- public/poems.js poems.js); do
            if git cat-file -e "$s:public/poems.js" 2>/dev/null; then SHA=$s; FILE=public/poems.js; break; fi
            if git cat-file -e "$s:poems.js" 2>/dev/null; then SHA=$s; FILE=poems.js; break; fi
          done
          echo "poems source sha=$SHA file=$FILE"
          git show "$SHA:$FILE" > /tmp/poems.js
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const code = fs.readFileSync("/tmp/poems.js", "utf8");
          const ctx = {};
          vm.runInNewContext(code + "\nthis.POEMS = POEMS;", ctx);
          fs.mkdirSync("public/data", { recursive: true });
          fs.writeFileSync("public/data/poems.json", JSON.stringify(ctx.POEMS) + "\n");
          console.log("poems", ctx.POEMS.length, fs.statSync("public/data/poems.json").size);
          NODE
          git add -f .gitignore public/data/poems.json
          git rm -f .github/workflows/add-poems-json.yml .github/workflows/assemble-poems.yml 2>/dev/null || true
          rm -f .github/workflows/add-poems-json.yml .github/workflows/assemble-poems.yml
          rm -rf .github/payloads
          git add -A
          git commit -m "feat: add public/data/poems.json (external poem library)"
          git push
