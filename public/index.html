<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6ee" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="辰辰的复习小花园：用图片、声音和小游戏，复习古诗、数学、拼音、汉字和英语。" />
  <title>辰辰的复习小花园</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="english.css" />
  <link rel="stylesheet" href="learning-records.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="#" id="brand-home" aria-label="回到复习首页"><span class="brand-icon" aria-hidden="true">✿</span><span>辰辰的<span class="brand-second">复习小花园</span></span></a>
      <div class="header-actions"><span class="age-label">幼小衔接 · 每天一点点</span><button type="button" class="parent-entry" id="open-parent"><span aria-hidden="true">⚙</span> 家长入口</button></div>
    </header>
    <nav class="nav" aria-label="学习导航">
      <button type="button" data-nav="home" class="active"><span class="ico" aria-hidden="true">⌂</span><span>复习小花园</span></button>
      <button type="button" data-nav="poems"><span class="ico" aria-hidden="true">☷</span><span>读古诗</span></button>
      <button type="button" data-nav="math"><span class="ico" aria-hidden="true">＋</span><span>玩数学</span></button>
      <button type="button" data-nav="pinyin"><span class="ico letter-ico" aria-hidden="true">a</span><span>读拼音</span></button>
      <button type="button" data-nav="write"><span class="ico" aria-hidden="true">✎</span><span>写汉字</span></button>
      <button type="button" data-nav="english"><span class="ico letter-ico" aria-hidden="true">Aa</span><span>玩英语</span></button>
    </nav>
    <main id="main-content">
      <section class="view active" data-view="home" id="home-content" aria-label="今日复习"></section>
      <section class="view" data-view="poems" id="poems-content" aria-label="古诗"></section>
      <section class="view" data-view="poem-detail" id="poem-detail-content" aria-label="古诗练习"></section>
      <section class="view" data-view="math" id="math-content" aria-label="数学练习"></section>
      <section class="view" data-view="pinyin" id="pinyin-content" aria-label="拼音练习"></section>
      <section class="view" data-view="write" id="write-content" aria-label="汉字字库"></section>
      <section class="view" data-view="write-detail" id="write-detail-content" aria-label="汉字读写练习"></section>
      <section class="view" data-view="english" id="english-content" aria-label="英语小花园"></section>
      <section class="view" data-view="records" id="records-content" aria-label="练习记录"></section>
    </main>
    <footer class="footer"><span aria-hidden="true">❀</span> 慢慢来，每一次想起来，都是小小的成长。</footer>
  </div>
  <dialog id="parent-dialog" class="parent-dialog" aria-labelledby="parent-title"></dialog>
  <div id="live-status" class="sr-only" aria-live="polite"></div>
  <script src="learning-model.js"></script>
  <script src="learning-records.js"></script>
  <script src="speech.js"></script>
  <script src="english-audio.js"></script>
  <script src="english.js"></script>
  <script src="vendor/hanzi-writer-3.7.3.min.js"></script>
  <script src="writing-vocabulary.js"></script>
  <script src="writing-audio.js"></script>
  <script src="writing-strokes.js"></script>
  <script src="pinyin-data.js"></script>
  <script src="pinyin-audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
